name: Catalogue sync

# Model line-ups and prices move without notice. This runs nightly, diffs the
# live catalogue against the committed snapshot, and opens an issue when
# something changed so tier defaults and pricing copy can be checked.
on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily, off the hour to dodge scheduler pileups
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Diff the catalogue
        id: diff
        run: |
          set +e
          node cron/sync-catalog.mjs > report.txt
          code=$?
          set -e
          cat report.txt
          echo "changed=$([ "$code" = "10" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # 0 = no change, 10 = changes; anything else is a real failure.
          if [ "$code" != "0" ] && [ "$code" != "10" ]; then exit "$code"; fi

      - name: Commit the new snapshot
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "catalogue-sync"
          git config user.email "actions@github.com"
          git add data/catalog-snapshot.json
          git commit -m "Catalogue sync: model or pricing changes" || exit 0
          git push

      - name: Open an issue with the changes
        if: steps.diff.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const body = require("fs").readFileSync("report.txt", "utf8");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Catalogue changed — ${new Date().toISOString().slice(0, 10)}`,
              body: "```\n" + body.slice(0, 60000) + "\n```",
              labels: ["catalogue"],
            });
